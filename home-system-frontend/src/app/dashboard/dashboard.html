<div class="container mt-4">
  <h3>Motion Events</h3>
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let motion of data(); let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ motion.Timestamp | date: 'dd.MM.yyyy hh:mm' }}</td>
      </tr>
    </tbody>
  </table>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div #toast class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Motion detected</strong>
      <small>just now</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      New motion event detected.
    </div>
  </div>
</div>
